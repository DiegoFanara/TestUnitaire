# On Commence par fournir un nom
name: Compilation du projet TestUnitaire

#La on specifie a quel moment le workflow doit s'executer. Ici
on:
  push:

jobs:
  compilation: #Nom premier job qui s'execute sur un runner Ubuntu
    runs-on: ubuntu-latest
    #Definitin des etape du wrokflow
    steps:
      - name: Va chercher le code source du projet
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:                          # ...paramétrée par des entrées (`with:`)
          java-version: '25'
          distribution: 'temurin'
      - name: Ajouter droit pour la compilation
        run: chmod +x ./mvnw
      - name: Compile le projet
        run: ./mvnw -B test -Dtest=CalculatriceTest#multiplierDeuxNombres
          
      